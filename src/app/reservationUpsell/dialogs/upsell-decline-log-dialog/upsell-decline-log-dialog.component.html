<div class="addContainer upsell-decline-log-dialog">
  <div class="modalHeader">
    <div class="editRowModal">
      <div class="modalHeader clearfix">
        <div class="modal-about">
          <div class="font-weight-bold p-t-5 font-17">
            Upsell Decline Log
            <span class="upsell-res-id" *ngIf="data?.reservationID">(#{{ data.reservationID }})</span>
          </div>
        </div>
      </div>
    </div>
    <button mat-icon-button type="button" (click)="close()" aria-label="Close dialog">
      <mat-icon>close</mat-icon>
    </button>
  </div>

  <mat-dialog-content>
    <div class="log-body">
      <div class="log-loading" *ngIf="isLoading">
        <mat-spinner diameter="36"></mat-spinner>
      </div>

      <div *ngIf="!isLoading && !rows.length" class="alert alert-primary log-empty">
        No upsell decline records found for this reservation.
      </div>

      <div class="log-table-wrap" *ngIf="!isLoading && rows.length">
        <table class="log-table">
          <thead>
            <tr>
              <th>Date / Time</th>
              <th>Reason</th>
              <th>Comment</th>
              <th>User</th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let row of rows">
              <td class="nowrap">{{ row.createdOn ? (row.createdOn | date:'dd-MM-yyyy HH:mm') : '—' }}</td>
              <td>{{ row.reasonName || '—' }}</td>
              <td>{{ row.comment || '—' }}</td>
              <td>{{ row.username || '—' }}</td>
            </tr>
          </tbody>
        </table>
      </div>

      <div class="example-button-row" *ngIf="!isLoading">
        <button mat-raised-button color="primary" type="button" (click)="close()">Close</button>
      </div>
    </div>
  </mat-dialog-content>
</div>
