<div class="addContainer settled-rate-view-dialog">
  <div class="modalHeader">
    <div class="editRowModal">
      <div class="modalHeader clearfix">
        <div class="modal-about">
          <div class="font-weight-bold p-t-5 font-17">
            Settled Rate Details
            <span *ngIf="reservationID"> (#{{ reservationID }})</span>
          </div>
        </div>
      </div>
    </div>
    <button mat-icon-button type="button" (click)="close()" aria-label="Close dialog">
      <mat-icon>close</mat-icon>
    </button>
  </div>

  <mat-dialog-content>
    <div class="view-loading" *ngIf="isLoading">
      <mat-spinner diameter="36"></mat-spinner>
    </div>

    <div *ngIf="!isLoading && !advanceTableSRD.length" class="alert alert-primary view-empty">
      No settled rate details found for this reservation.
    </div>

    <div *ngIf="!isLoading && advanceTableSRD.length">
      <app-settledRateDetails
        [advanceTableSRD]="advanceTableSRD"
        [reservationID]="reservationID"
        [readOnly]="true"
        [disableAutoLoad]="true">
      </app-settledRateDetails>
    </div>
  </mat-dialog-content>
</div>
