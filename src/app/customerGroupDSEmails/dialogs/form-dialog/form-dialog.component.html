<div class="addContainer">
    <div class="modalHeader">
        <div class="editRowModal">
            <div class="modalHeader clearfix">
                <div class="modal-about">
                    <div class="font-weight-bold p-t-5 font-17">
                        {{dialogTitle}} for {{CustomerGroup}}</div>
                </div>
            </div>
        </div>
        <button mat-icon-button (click)="dialogRef.close()" aria-label="Close dialog">
      <mat-icon>close</mat-icon>
    </button>
    </div>
    <div mat-dialog-content>
        <form class="register-form m-4" [formGroup]="advanceTableForm" (ngSubmit)="submit">

            <div class="row">
                <div class="col-12 mb-3">
                    <label class="field-label" *ngIf="action==='add'">Email ID (single or multiple, comma-separated)</label>
                    <label class="field-label" *ngIf="action==='edit'">Email ID</label>
                    <mat-form-field class="example-full-width" appearance="outline">
                        <input matInput formControlName="emailID" required
                               [placeholder]="action==='add' ? 'abc@example.com, xyz@example.com' : 'abc@example.com'">
                        <mat-error *ngIf="advanceTableForm.get('emailID').hasError('required')">
                            Email ID is required
                        </mat-error>
                        <mat-error *ngIf="advanceTableForm.get('emailID').hasError('multipleEmails')">
                            Only one Email ID is allowed while editing
                        </mat-error>
                        <mat-error *ngIf="advanceTableForm.get('emailID').hasError('invalidEmail')">
                            Enter a valid Email ID
                        </mat-error>
                    </mat-form-field>
                </div>
            </div>

            <div class="row" *ngIf="action==='edit'">
                <div class="col-xl-6 col-lg-6 col-md-12 col-sm-12 mb-3">
                    <label class="field-label">Activation Status</label>
                    <mat-form-field class="example-full-width" appearance="outline">
                        <mat-select formControlName="activationStatus">
                            <mat-option [value]=true>Active</mat-option>
                            <mat-option [value]=false>Deleted</mat-option>
                        </mat-select>
                        <mat-error *ngIf="advanceTableForm.get('activationStatus').hasError('required')">
                            Activation Status is required
                        </mat-error>
                    </mat-form-field>
                </div>
            </div>

            <div class="row">
                <div class="col-xl-12 col-lg-12 col-md-12 col-sm-12 mb-2">
                    <div class="example-button-row">
                        <button mat-raised-button color="primary" *ngIf="saveDisabled" [type]="submit" [disabled]="!advanceTableForm.valid"  (click)="confirmAdd()">Save</button>
                        <mat-spinner *ngIf="!saveDisabled" diameter="30"></mat-spinner>
                        <button *ngIf="action==='add'" mat-raised-button color="warn" (click)="reset()" tabindex="-1">Reset</button>
                        <button *ngIf="action==='edit'" mat-raised-button color="warn" (click)="onNoClick()" tabindex="-1">Cancel</button>
                    </div>
                </div>
            </div>
        </form>
  </div>
