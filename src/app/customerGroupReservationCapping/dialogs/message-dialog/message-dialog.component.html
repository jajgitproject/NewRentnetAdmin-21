<div class="cg-msg-dialog">
  <div class="cg-msg-dialog__header">
    <div class="cg-msg-dialog__icon" aria-hidden="true">
      <mat-icon>info</mat-icon>
    </div>
    <h2 class="cg-msg-dialog__title">{{ data.title || 'Notice' }}</h2>
    <button mat-icon-button type="button" class="cg-msg-dialog__close" (click)="onClose()" aria-label="Close">
      <mat-icon>close</mat-icon>
    </button>
  </div>
  <div mat-dialog-content class="cg-msg-dialog__content">
    <p class="cg-msg-dialog__message">{{ data.message }}</p>
  </div>
  <div mat-dialog-actions class="cg-msg-dialog__actions">
    <button mat-flat-button color="primary" type="button" (click)="onClose()">OK</button>
  </div>
</div>
