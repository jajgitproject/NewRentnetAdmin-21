<mat-form-field class="cg-city-field example-full-width" appearance="outline" subscriptSizing="dynamic">
    <mat-label>{{ label }}</mat-label>
    <mat-select
        [(ngModel)]="value"
        [multiple]="multiple"
        [required]="required"
        [disabled]="disabled"
        [placeholder]="placeholder"
        (selectionChange)="onSelectionChange()"
        (openedChange)="onPanelOpen($event)">
        <mat-option class="select-filter-option" disabled>
            <input
                class="select-filter-input"
                matInput
                [placeholder]="searchPlaceholder"
                [(ngModel)]="filterText"
                [ngModelOptions]="{standalone: true}"
                (input)="onFilterTextInput()"
                (click)="$event.stopPropagation()"
                (keydown)="$event.stopPropagation()">
        </mat-option>
        <mat-option *ngIf="!multiple && showAllOption" [value]="null">All</mat-option>
        <mat-option *ngIf="showTypeToSearchHint" disabled>
            <ng-container *ngIf="remoteSearch">Type at least {{ minSearchLength }} characters to search</ng-container>
            <ng-container *ngIf="!remoteSearch">Type to filter cities</ng-container>
        </mat-option>
        <mat-option *ngIf="showNoCityFound" disabled>
            No city found
        </mat-option>
        <mat-option *ngFor="let city of filteredCities" [value]="city.geoPointID">
            {{ city.geoPointName }}
        </mat-option>
    </mat-select>
</mat-form-field>
