<section class="content">
  <div class="container-fluid">
    <div class="block-header">
      <div class="row">
        <div class="col-xs-12 col-sm-12 col-md-12 col-lg-12">
          <ul class="breadcrumb breadcrumb-style">
            <li class="breadcrumb-item">
              <h2>Ticket Dashboard</h2>
            </li>
          </ul>
        </div>
      </div>
    </div>

    <div class="row">
      <div class="col-xl-3 col-lg-3 col-md-4 col-sm-6 col-xs-12" *ngFor="let status of statuses">
        <div class="card">
          <div class="body text-center">
            <h3 class="m-b-0">{{ total(status) }}</h3>
            <span>{{ status }}</span>
          </div>
        </div>
      </div>
    </div>

    <div class="row" *ngIf="workload.length">
      <div class="col-lg-12 col-md-12 col-sm-12 col-xs-12">
        <div class="card">
          <div class="header">
            <h2>Open workload</h2>
          </div>
          <div class="body">
            <div class="table-responsive">
              <table class="table">
                <thead>
                  <tr><th>Person</th><th>Role</th><th>Open tickets</th></tr>
                </thead>
                <tbody>
                  <tr *ngFor="let row of workload">
                    <td>{{ row.name }}</td>
                    <td>{{ row.role }}</td>
                    <td>{{ row.openTickets }}</td>
                  </tr>
                </tbody>
              </table>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
