<div class="addContainer booking-refusal-form-dialog">
    <div class="modalHeader">
        <div class="editRowModal">
            <div class="modalHeader clearfix">
                <div class="modal-about">
                    <div class="font-weight-bold p-t-5 font-17">
                        {{dialogTitle}}</div>
                </div>
            </div>
        </div>
        <button mat-icon-button (click)="dialogRef.close()" aria-label="Close dialog">
      <mat-icon>close</mat-icon>
    </button>
    </div>
    <div mat-dialog-content>
        <form class="register-form m-4" [formGroup]="advanceTableForm">
            <div class="row">
                <div class="col-xl-6 col-lg-6 col-md-12 col-sm-12 mb-2">
                    <mat-form-field class="example-full-width" appearance="outline" floatLabel="always">
                        <mat-label>Customer Name</mat-label>
                        <input type="text" matInput [formControl]="customerPicker" [matAutocomplete]="autoCustomer"
                            autocomplete="off">
                        <mat-autocomplete #autoCustomer="matAutocomplete" [displayWith]="displayCustomer"
                            (optionSelected)="onCustomerSelected($event.option.value)">
                            <mat-option *ngFor="let c of customerOptions$ | async" [value]="c">{{c.customerName}}</mat-option>
                        </mat-autocomplete>
                    </mat-form-field>
                </div>
                <div class="col-xl-6 col-lg-6 col-md-12 col-sm-12 mb-2">
                    <mat-form-field class="example-full-width" appearance="outline" floatLabel="always">
                        <mat-label>City</mat-label>
                        <input type="text" matInput [formControl]="cityPicker" [matAutocomplete]="autoCity"
                            autocomplete="off">
                        <mat-autocomplete #autoCity="matAutocomplete" [displayWith]="displayCity"
                            (optionSelected)="onCitySelected($event.option.value)">
                            <mat-option *ngFor="let city of cityOptions$ | async" [value]="city">{{city.geoPointName}}</mat-option>
                        </mat-autocomplete>
                    </mat-form-field>
                </div>
                <div class="col-xl-6 col-lg-6 col-md-12 col-sm-12 mb-2">
                    <mat-form-field class="example-full-width" appearance="outline" floatLabel="always">
                        <mat-label>Duty Type</mat-label>
                        <input type="text" matInput [formControl]="dutyTypePicker" [matAutocomplete]="autoDuty"
                            autocomplete="off">
                        <mat-autocomplete #autoDuty="matAutocomplete" [displayWith]="displayDutyType"
                            (optionSelected)="onDutyTypeSelected($event.option.value)">
                            <mat-option *ngFor="let p of dutyTypeOptions$ | async" [value]="p">{{p.packageType}}</mat-option>
                        </mat-autocomplete>
                    </mat-form-field>
                </div>
                <div class="col-xl-6 col-lg-6 col-md-12 col-sm-12 mb-2">
                    <mat-form-field class="example-full-width" appearance="outline" floatLabel="always">
                        <mat-label>Car</mat-label>
                        <input type="text" matInput [formControl]="vehiclePicker" [matAutocomplete]="autoVehicle"
                            autocomplete="off">
                        <mat-autocomplete #autoVehicle="matAutocomplete" [displayWith]="displayVehicle"
                            (optionSelected)="onVehicleSelected($event.option.value)">
                            <mat-option *ngFor="let v of vehicleOptions$ | async" [value]="v">{{v.vehicle}}</mat-option>
                        </mat-autocomplete>
                    </mat-form-field>
                </div>
                <div class="col-xl-6 col-lg-6 col-md-12 col-sm-12 mb-2">
                    <mat-form-field class="example-full-width" appearance="outline" floatLabel="always">
                        <mat-label>Date</mat-label>
                        <input matInput [matDatepicker]="pickUpDatePicker" formControlName="pickUpDate" required>
                        <mat-datepicker-toggle matSuffix [for]="pickUpDatePicker"></mat-datepicker-toggle>
                        <mat-datepicker #pickUpDatePicker></mat-datepicker>
                    </mat-form-field>
                </div>
                <div class="col-xl-6 col-lg-6 col-md-12 col-sm-12 mb-2 booking-refusal-time-field">
                    <mat-form-field class="example-full-width" appearance="outline" floatLabel="always">
                        <mat-label>Time</mat-label>
                        <input matInput [owlDateTime]="pickUpTimePicker" formControlName="pickUpTime" required
                            autocomplete="off" readonly (focus)="deferOpenTimePicker()">
                        <button mat-icon-button matSuffix type="button" (click)="deferOpenTimePicker()"
                            class="date-icon" aria-label="Open time picker">
                            <mat-icon>schedule</mat-icon>
                        </button>
                    </mat-form-field>
                    <owl-date-time [pickerType]="'timer'" #pickUpTimePicker></owl-date-time>
                </div>
                <div class="col-xl-6 col-lg-6 col-md-12 col-sm-12 mb-2">
                    <mat-form-field class="example-full-width" appearance="outline" floatLabel="always">
                        <mat-label>Location</mat-label>
                        <input type="text" matInput [formControl]="locationPicker" [matAutocomplete]="autoLocation"
                            autocomplete="off">
                        <mat-autocomplete #autoLocation="matAutocomplete" [displayWith]="displayLocation"
                            (optionSelected)="onLocationSelected($event.option.value)">
                            <mat-option *ngFor="let loc of locationOptions$ | async" [value]="loc">{{loc.organizationalEntityName}}</mat-option>
                        </mat-autocomplete>
                    </mat-form-field>
                </div>
                <div class="col-xl-6 col-lg-6 col-md-12 col-sm-12 mb-2">
                    <mat-form-field class="example-full-width" appearance="outline" floatLabel="always">
                        <mat-label>Activation Status</mat-label>
                        <mat-select formControlName="activationStatus" required>
                            <mat-option [value]="true">Active</mat-option>
                            <mat-option [value]="false">Deactive</mat-option>
                        </mat-select>
                    </mat-form-field>
                </div>
                <div class="col-xl-12 col-lg-12 col-md-12 col-sm-12 mb-2">
                    <mat-form-field class="example-full-width" appearance="outline" floatLabel="always">
                        <mat-label>Remarks</mat-label>
                        <textarea matInput formControlName="remarks" rows="3" maxlength="500" required></textarea>
                    </mat-form-field>
                </div>
            </div>
            <div class="row">
                <div class="col-xl-12 col-lg-12 col-md-12 col-sm-12 mb-2">
                    <div class="example-button-row">
                        <button mat-raised-button *ngIf="saveDisabled" color="primary" [disabled]="!advanceTableForm.valid" (click)="confirmAdd()">Save</button>
                        <mat-spinner *ngIf="!saveDisabled" diameter="30"></mat-spinner>
                        <button *ngIf="action==='add'" mat-raised-button color="warn" (click)="onNoClick()" tabindex="-1">Reset</button>
                        <button *ngIf="action==='edit'" mat-raised-button color="warn" (click)="onNoClick()" tabindex="-1">Cancel</button>
                    </div>
                </div>
            </div>
        </form>
    </div>
</div>
