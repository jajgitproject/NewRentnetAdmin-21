<div class="container">
  <h2 mat-dialog-title>Delete Booking Refusal</h2>
  <h3 mat-dialog-title>Are you sure?</h3>
  <div mat-dialog-content>
    <ul class="clearfix">
      <li>
        <p><span class="font-weight-bold">Customer: </span>{{data.customerName}}</p>
      </li>
      <li>
        <p><span class="font-weight-bold">Date: </span>{{data.pickUpDateString || data.pickUpDate}}</p>
      </li>
    </ul>
  </div>
  <div mat-dialog-actions class="mb-1">
    <button mat-flat-button color="warn" (click)="confirmDelete()">
      Delete
    </button>
    <button mat-flat-button (click)="onNoClick()" tabindex="-1">Cancel</button>
  </div>
</div>
