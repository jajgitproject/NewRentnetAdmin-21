<section class="content">
    <div class="container-fluid">
        <div class="block-header">
            <div class="row">
                <div class="col-xs-12 col-sm-12 col-md-12 col-lg-12">
                    <ul>
                        <li class="breadcrumb-item bcrumb-1">
                            <a routerLink="/dashboard/main">
                                <i class="fas fa-home"></i> Home</a>|
                            <a href="#" onClick="return false;">Admin</a>|
                            <a href="#" onClick="return false;">Integration Log</a>
                        </li>
                    </ul>
                    <ul class="breadcrumb breadcrumb-style ">
                        <li class="breadcrumb-item">
                            <h2>Integration Log</h2>
                        </li>
                    </ul>
                </div>
            </div>
        </div>
        <div class="row">
            <div class="col-lg-12 col-md-12 col-sm-12 col-xs-12">
                <div class="card">
                    <div class="body">
                        <div class="responsive_table">
                            <div class="materialTableHeader">
                                <div class="row">
                                    <!-- <div style="width: 70%; float:left;padding-top: 15px;padding-left: 22px;">
                                        <div style="float:left" *ngIf="SearchColor"><b>Color</b> : {{SearchColor}}</div>
                                    </div> -->

                                    <div style="width: 70%; float:left;padding-top: 6px;padding-left: 12px;">
                                        <div class="col-lg-6">
                                            <div class="form-group">
                                                <div class="input-group">
                                                    <!-- Dropdown for selecting Type, Parent, City -->
                                                    <div class="input-group-append input-group-addon">
                                                        <select style="height: 40px; width: 120px;" class="form-control" [(ngModel)]="selectedFilter">
                                                            <option value="search" hidden>Search By</option>
                                                            <option value="ReservationID">ReservationID</option>                                                          
                                                        </select>
                                                    </div>
                                        
                                                    <!-- Input field for filtering -->
                                                    <input type="text" style="height: 40px; width: 300px;padding-left: 5px;" class="form-control" placeholder="Filter" id="inputGroup"
                                                        (keyup)="onBackPress($event)" (input)="loadData()" [(ngModel)]="searchTerm" />
                                        
                                                    <!-- Search button -->
                                                    <div class="input-group-append input-group-addon">
                                                        <span class="input-group-text" style="cursor: pointer; height: 40px; width: 40px; text-align: center;" (click)="loadData()">
                                                            <i class="fas fa-search"></i>
                                                        </span>
                                                    </div>
                                                </div>
                                            </div>
                                        </div>                                        
                                    </div>

                                    <div style="width: 30%; text-align:right;">
                                        <!-- <button mat-raised-button color="primary"
                                            data-dismiss="modal" data-toggle="modal" data-backdrop="false"
                                            data-target="#exampleModalCenter">
                                            Search
                                        </button>
                                        &nbsp; -->
                                <!-- <button mat-mini-fab color="primary" (click)="addNew()">
                                            <mat-icon class="col-white">add</mat-icon>
                                        </button>
                                        &nbsp; -->
                                        <button mat-mini-fab color="primary" (click)="refresh()">
                                            <mat-icon class="col-white">refresh</mat-icon>
                                        </button>
                                        &nbsp;
                                    </div>
                                </div>
                            </div>

                            <h2 mat-dialog-title class="dialog-header d-flex justify-content-between align-items-center">
  
                                

                                </h2>

                                <div mat-dialog-content class="container-fluid addContainer">

                                <!-- 🔥 Premium Tabs -->
                                <div class="custom-tabs mb-4">
                                    <div 
                                    class="tab-item"
                                    *ngFor="let tab of tabs"
                                    [ngClass]="[
                                        selectedTab === tab.key ? 'active' : '',
                                        getTabStatusClass(tab.key)
                                    ]"
                                    (click)="selectTab(tab.key)"
                                    >
                                    {{tab.label}}
                                    </div>
                                </div>

                                <!-- 🔥 Data -->
                                <ng-container *ngIf="filteredData.length > 0; else noData">

                                <div *ngFor="let item of filteredData">

                                    <div class="card mb-4">

                                        <!-- 🔥 Header -->
                                        <div class="card-header-custom">

                                        <div class="status-block">
                                            <span class="status-label">Status:</span>
                                            <span [ngClass]="getStatusClass(item.eventStatus)">
                                            {{item.eventStatus}}
                                            </span>
                                        </div>

                                        <div class="date-block">
                                            DateTime - 
                                            {{item.sendDateTime | date:'dd-MM-yyyy HH:mm:ss'}}
                                        </div>

                                        </div>

                                        

                                        <!-- 🔥 Request / Response -->
                                        <div class="row">
                                        <div class="col-md-6">
                                            <div class="section-title">Request</div>
                                            <pre class="box">{{item.request | json}}</pre>
                                        </div>

                                        <div class="col-md-6">
                                            <div class="section-title">Response</div>
                                            <pre class="box">{{item.response | json}}</pre>
                                        </div>
                                        </div>

                                        <!-- 🔥 Button -->
                                        <div class="text-end mt-3">
                                       <div class="text-end mt-3">
                                            <button
                                                *ngIf="item.eventStatus === 'Failure'"
                                                class="btn-resend"
                                                (click)="resend(item)">
                                                🔁 Resend
                                            </button>
                                        </div>
                                        </div>

                                    </div>

                                    </div>

                                </ng-container>

                                <!-- 🔥 No Data -->
                                <ng-template #noData>
                                    <div class="no-data">
                                    🚫 No Data Found
                                    </div>
                                </ng-template>

                                </div>

                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
