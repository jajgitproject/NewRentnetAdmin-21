<div class="addContainer">
    <div class="modalHeader">
        <div class="editRowModal">
            <div class="modalHeader clearfix">
                <div class="modal-about">
                    <div class="font-weight-bold p-t-5 font-17">
                        {{dialogTitle}}</div>
                </div>
            </div>
        </div>
        <button mat-icon-button (click)="dialogRef.close()" aria-label="Close dialog">
      <mat-icon>close</mat-icon>
    </button>
    </div>
    <div mat-dialog-content>
        <form class="register-form m-4" [formGroup]="advanceTableForm" (ngSubmit)="submit">
            <div class="row">
                <div class="col-xl-6 col-lg-6 col-md-12 col-sm-12 mb-2">
                    <mat-form-field class="example-full-width" appearance="outline" floatLabel="always"
                        [ngClass]="{'employee-dropdown-exited-selected': isSelectedEmployeeExited()}">
                        <mat-label>Employee Name</mat-label>
                        <input type="text" matInput [formControl]="employeeNameControl" [matAutocomplete]="autoKamEmployee"
                            (keyup)="InitEmployeePrefix()">
                        <mat-autocomplete #autoKamEmployee="matAutocomplete" class="employee-dropdown-autocomplete-panel"
                            [displayWith]="displayEmployeeFn"
                            (optionSelected)="onEmployeeSelected($event.option.value)">
                            <mat-option *ngFor="let option of filteredEmployeeOptions | async" [value]="option"
                                [class.employee-dropdown-exited]="isEmployeeExited(option)">
                                <span class="employee-dropdown-option-text"
                                    [class.employee-dropdown-option-text-exited]="isEmployeeExited(option)">
                                    {{ formatEmployeeDropdownLabel(option) }}
                                </span>
                            </mat-option>
                        </mat-autocomplete>
                    </mat-form-field>
                </div>

                <div class="col-xl-6 col-lg-6 col-md-12 col-sm-12 mb-2">
                    <mat-form-field class="example-full-width" appearance="outline" floatLabel="always">
                        <mat-label>Employee Mobile</mat-label>
                        <input matInput [value]="selectedEmployeeMobile" readonly>
                    </mat-form-field>
                </div>
            </div>
          
            <div class="row">
                <div class="col-xl-6 col-lg-6 col-md-12 col-sm-12 mb-2">
                    <mat-form-field class="example-full-width" appearance="outline" floatLabel="always">
                        <mat-label>Employee Email</mat-label>
                        <input matInput [value]="selectedEmployeeEmail" readonly>
                    </mat-form-field>
                </div>
            </div>
            <div class="row">
                <div class="col-xl-12 col-lg-12 col-md-12 col-sm-12 mb-2">
                    <div class="example-button-row">
                        <button mat-raised-button color="primary" type="button" [disabled]="!advanceTableForm.valid"  (click)="confirmAdd()">Save</button>
                        <button mat-raised-button color="warn" (click)="onNoClick()" tabindex="-1">Cancel</button>
                    </div>
                </div>
            </div>
        </form>
    </div>
</div>
