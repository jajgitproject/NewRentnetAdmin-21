<div class="addContainer">
    <div class="modalHeader">
        <div class="editRowModal">
            <div class="modalHeader clearfix">
                <div class="modal-about" style="text-align: center;">
                    <div class="font-weight-bold p-t-5 font-17">
                        {{dialogTitle}}
                    </div>
                </div>
            </div>
        </div>
        <button mat-icon-button (click)="dialogRef.close()" aria-label="Close dialog">
            <mat-icon>close</mat-icon>
        </button>
    </div>
    <div mat-dialog-content>
        <form class="register-form m-4" [formGroup]="advanceTableForm" (ngSubmit)="submit">
            <div class="row">
                <div class="col-xl-6 col-lg-6 col-md-12 col-sm-12 mb-2">
                    <mat-form-field class="example-full-width" appearance="outline" floatLabel="always"
                        [ngClass]="{'employee-dropdown-exited-selected': isSelectedOldKamExited()}">
                        <mat-label>Old KAM</mat-label>
                        <input required type="text" matInput formControlName="oldCustomerkamEmployee"
                            [matAutocomplete]="autoOld" (keyup)="InitOldKamEmployee($event)">
                        <mat-autocomplete #autoOld="matAutocomplete" class="employee-dropdown-autocomplete-panel"
                            [displayWith]="displayEmployeeFn"
                            (optionSelected)="OnOldKamSelected($event.option.value)">
                            <mat-option *ngFor="let option of filteredinstructedByOptionss | async" [value]="option"
                                [class.employee-dropdown-exited]="isEmployeeExited(option)">
                                <span class="employee-dropdown-option-text"
                                    [class.employee-dropdown-option-text-exited]="isEmployeeExited(option)">
                                    {{ formatEmployeeDropdownLabel(option) }}
                                </span>
                            </mat-option>
                        </mat-autocomplete>
                        <mat-error
                            *ngIf="advanceTableForm.controls['oldCustomerkamEmployee']?.hasError('required') && advanceTableForm.controls['oldCustomerkamEmployee']?.touched">
                            Old KAM is required
                        </mat-error>
                        <mat-error
                            *ngIf="advanceTableForm.controls['oldCustomerkamEmployee']?.hasError('employeeNameInvalid') && advanceTableForm.controls['oldCustomerkamEmployee']?.touched">
                            Please select an old KAM
                        </mat-error>
                    </mat-form-field>
                </div>
                <div class="col-xl-6 col-lg-6 col-md-12 col-sm-12 mb-2">
                    <mat-form-field class="example-full-width" appearance="outline" floatLabel="always"
                        [ngClass]="{'employee-dropdown-exited-selected': isSelectedNewKamExited()}">
                        <mat-label>New KAM</mat-label>
                        <input required type="text" matInput formControlName="newCustomerkamEmployee"
                            [matAutocomplete]="autoNew" (keyup)="InitNewKamEmployee($event)">
                        <mat-autocomplete #autoNew="matAutocomplete" class="employee-dropdown-autocomplete-panel"
                            [displayWith]="displayEmployeeFn"
                            (optionSelected)="OnNewKamSelected($event.option.value)">
                            <mat-option *ngFor="let option of filteredinstructedByOptions | async" [value]="option"
                                [class.employee-dropdown-exited]="isEmployeeExited(option)">
                                <span class="employee-dropdown-option-text"
                                    [class.employee-dropdown-option-text-exited]="isEmployeeExited(option)">
                                    {{ formatEmployeeDropdownLabel(option) }}
                                </span>
                            </mat-option>
                        </mat-autocomplete>
                        <mat-error
                            *ngIf="advanceTableForm.controls['newCustomerkamEmployee']?.hasError('required') && advanceTableForm.controls['newCustomerkamEmployee']?.touched">
                            New KAM is required
                        </mat-error>
                        <mat-error
                            *ngIf="advanceTableForm.controls['newCustomerkamEmployee']?.hasError('employeeNameInvalid') && advanceTableForm.controls['newCustomerkamEmployee']?.touched">
                            Please select a new KAM
                        </mat-error>
                    </mat-form-field>
                </div>
            </div>
            <div class="row">
                <div class="col-xl-6 col-lg-6 col-md-12 col-sm-12 mb-2">
                    <mat-form-field class="example-full-width" appearance="outline" floatLabel="always">
                        <mat-label>From Date</mat-label>
                        <input required matInput [matDatepicker]="fromDate" formControlName="newKAMActivationFromDate"
                            (blur)="onBlurFromDate($event.target.value)">
                        <mat-datepicker-toggle matSuffix [for]="fromDate"></mat-datepicker-toggle>
                        <mat-datepicker #fromDate></mat-datepicker>
                    </mat-form-field>
                </div>
                <div class="col-xl-6 col-lg-6 col-md-12 col-sm-12 mb-2">
                    <mat-form-field class="example-full-width" appearance="outline" floatLabel="always">
                        <mat-label>Activation Status</mat-label>
                        <mat-select formControlName="newKAMActivationStatus">
                            <mat-option [value]=true>Active</mat-option>
                            <mat-option [value]=false>Deleted</mat-option>
                        </mat-select>
                    </mat-form-field>
                </div>
            </div>
            <div class="row">
                <div class="col-xl-12 col-lg-12 col-md-12 col-sm-12 mb-2">
                    <div class="example-button-row">
                        <button mat-raised-button color="primary" type="button" [disabled]="!advanceTableForm.valid"
                            (click)="confirmAdd()">Save</button>
                        <button mat-raised-button color="warn" (click)="onNoClick(action)" type="button">Cancel</button>
                    </div>
                </div>
            </div>
        </form>
    </div>
</div>
