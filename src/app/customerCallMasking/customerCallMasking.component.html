<section class="content">
  <div class="container-fluid">
    <div class="block-header">
      <div class="row">
        <div class="col-xs-12 col-sm-12 col-md-12 col-lg-12">
          <ul>
            <li class="breadcrumb-item bcrumb-1">
              <a routerLink="/dashboard/main"><i class="fas fa-home"></i> Home</a>|
              <a href="#">Admin</a>|
              <a href="#">Customer Call Masking</a>
            </li>
          </ul>
          <ul class="breadcrumb breadcrumb-style">
            <li class="breadcrumb-item">
              <h2>Customer Call Masking</h2>
            </li>
          </ul>
          <p class="page-subtitle">
            When a customer has Call Masking set to Yes, both male and female passengers are masked.
            When it is No, masking follows the switches below.
          </p>
        </div>
      </div>
    </div>

    <div class="card">
      <div class="body">
        <div class="spinner-wrap" *ngIf="isLoading">
          <mat-spinner diameter="36"></mat-spinner>
        </div>

        <form [formGroup]="form" (ngSubmit)="save()" *ngIf="!isLoading">
          <div class="row">
            <div class="col-xl-3 col-lg-3 col-md-6 col-sm-12 mb-2">
              <mat-form-field class="example-full-width" appearance="outline" floatLabel="always">
                <mat-label>Female</mat-label>
                <mat-select formControlName="femaleEnabled">
                  <mat-option [value]="true">Yes</mat-option>
                  <mat-option [value]="false">No</mat-option>
                </mat-select>
              </mat-form-field>
            </div>
            <div class="col-xl-3 col-lg-3 col-md-6 col-sm-12 mb-2">
              <mat-form-field class="example-full-width" appearance="outline" floatLabel="always">
                <mat-label>Male</mat-label>
                <mat-select formControlName="maleEnabled">
                  <mat-option [value]="true">Yes</mat-option>
                  <mat-option [value]="false">No</mat-option>
                </mat-select>
              </mat-form-field>
            </div>
            <div class="col-xl-3 col-lg-3 col-md-6 col-sm-12 filter-actions">
              <button mat-raised-button color="primary" type="submit" [disabled]="isSaving">
                Save
              </button>
            </div>
          </div>
        </form>
      </div>
    </div>
  </div>
</section>
