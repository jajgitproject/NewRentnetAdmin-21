<div class="modalHeader no-print">
  <div class="editRowModal">
    <div class="modalHeader clearfix">
      <div class="modal-about">
        <div class="font-weight-bold p-t-5 font-17">
          {{ dialogTitle }}
        </div>
      </div>
    </div>
  </div>
  <button mat-icon-button (click)="dialogRef.close()" aria-label="Close dialog">
    <mat-icon class="small-close-icon">close</mat-icon>
  </button>
</div>

<div class="placard-dialog-body">
  <div class="placard-preview" id="passenger-placard-preview">
    <div class="placard-frame">
      <div class="welcome-label">Welcome</div>
      <div class="passenger-name">{{ passengerName }}</div>
    </div>
  </div>

  <div class="placard-actions no-print">
    <button mat-raised-button color="primary" type="button" (click)="printPlacard()">
      <mat-icon>print</mat-icon>
      Print
    </button>
    <button mat-stroked-button type="button" (click)="dialogRef.close()">
      Close
    </button>
  </div>
</div>
