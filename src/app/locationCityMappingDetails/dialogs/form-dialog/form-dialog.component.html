<div class="addContainer">
    <div class="modalHeader">
        <div class="editRowModal">
            <div class="modalHeader clearfix">
                <div class="modal-about">
                    <div class="font-weight-bold p-t-5 font-17">
                        {{dialogTitle}} for {{locationName}}</div>
                </div>
            </div>
        </div>
        <button mat-icon-button (click)="dialogRef.close()" aria-label="Close dialog">
      <mat-icon>close</mat-icon>
    </button>
    </div>
    <div mat-dialog-content>
        <div class="register-form m-4">
            <div class="row">
                <div class="col-xl-12 col-lg-12 col-md-12 col-sm-12 mb-2">
                    <mat-form-field class="example-full-width" appearance="outline" floatLabel="always">
                        <mat-label>Search City</mat-label>
                        <input matInput [(ngModel)]="searchCity" (keyup)="filterCities()">
                    </mat-form-field>
                </div>
            </div>
            <div class="row" *ngIf="filteredCityList.length === 0">
                <div class="col-xl-12 col-lg-12 col-md-12 col-sm-12 mb-2">
                    <div class="alert alert-primary" style="background-color:#E8E8E8; text-align: center;">
                        No cities remaining for mapping
                    </div>
                </div>
            </div>
            <div class="city-list" *ngIf="filteredCityList.length > 0">
                <div class="city-list-header">
                    <mat-checkbox (change)="$event ? masterToggle() : null"
                        [checked]="selection.hasValue() && isAllSelected()"
                        [indeterminate]="selection.hasValue() && !isAllSelected()">
                        Select All
                    </mat-checkbox>
                </div>
                <div class="city-list-body">
                    <div class="city-list-item" *ngFor="let city of filteredCityList">
                        <mat-checkbox (click)="$event.stopPropagation()"
                            (change)="$event ? selection.toggle(city) : null"
                            [checked]="selection.isSelected(city)">
                            {{city.city}}
                        </mat-checkbox>
                    </div>
                </div>
            </div>
            <div class="row">
                <div class="col-xl-12 col-lg-12 col-md-12 col-sm-12 mb-2">
                    <div class="example-button-row">
                        <button mat-raised-button color="primary" [disabled]="selection.selected.length === 0 || !saveDisabled"
                            (click)="confirmAdd()">Map</button>
                        <mat-spinner *ngIf="isLoading" diameter="30"></mat-spinner>
                        <button mat-raised-button color="warn" (click)="onNoClick()" tabindex="-1">Cancel</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
